crons:
  - name: daily-backup
    description: "Daily encrypted DB backup uploaded to cloud storage + emailed download link"
    cron: "0 2 * * *"
    timezone: "Asia/Aden"
    endpoint: "{{BASE_URL}}/api/cron/daily-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
